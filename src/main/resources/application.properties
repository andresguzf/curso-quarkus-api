# ===== Aplicación =====
quarkus.application.name=3-quarkus-api
quarkus.http.port=8080

# ===== Packaging =====
quarkus.package.jar.enabled=true
quarkus.package.jar.type=fast-jar

# ===== Dev Mode: Live Coding, Hot Reload y Dev UI (./mvnw quarkus:dev) =====
# Live coding está activo por defecto en dev mode; Dev UI en http://localhost:8080/q/dev-ui
quarkus.live-reload.instrumentation=true
%dev.quarkus.log.console.level=INFO

# ===== OpenAPI / Swagger UI =====
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ===== Datasource PostgreSQL =====
quarkus.datasource.db-kind=postgresql
# Dev y test no definen jdbc.url: si se define, Dev Services se desactiva.
# Dev: compose-devservices.yml (PostgreSQL + pgAdmin). Quarkus detecta el servicio postgres y arma
# la conexión con sus POSTGRES_DB/USER/PASSWORD. Los contenedores quedan corriendo al detener la
# app (sin Ryuk ni stop) y los datos se guardan en el volumen quarkusapi-postgres-data.
%dev.quarkus.compose.devservices.project-name=quarkusapi
%dev.quarkus.compose.devservices.stop-services=false
%dev.quarkus.compose.devservices.ryuk-enabled=false
%dev.quarkus.compose.devservices.remove-volumes=false
# Test: sin compose; Dev Services crea un PostgreSQL temporal en un puerto aleatorio.
%test.quarkus.compose.devservices.enabled=false
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/quarkusapi}
%prod.quarkus.datasource.username=${DB_USERNAME:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}

# ===== Hibernate ORM =====
# Dev: update conserva los datos entre reinicios y agrega tablas/columnas nuevas
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=true

# ===== Seguridad: JWT en cookie HttpOnly =====
# smallrye-jwt lee el token de la cookie access_token en vez de la cabecera Authorization
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=access_token
mp.jwt.verify.issuer=quarkusapi
smallrye.jwt.new-token.issuer=quarkusapi
app.auth.token-duration=1H
# Secure: la cookie solo viaja por HTTPS. En dev y test se usa http
app.auth.cookie-secure=true
%dev.app.auth.cookie-secure=false
%test.app.auth.cookie-secure=false
# Claves RSA: en dev y test Quarkus genera un par en memoria (los tokens dejan de valer al reiniciar);
# en prod se leen de archivos PEM
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
# Admin inicial: se crea al arrancar si no existe ningún admin (los tests crean sus propios usuarios)
app.auth.admin.email=${ADMIN_EMAIL:}
app.auth.admin.password=${ADMIN_PASSWORD:}
%test.app.auth.admin.email=
%test.app.auth.admin.password=
# La autenticación se resuelve al llegar al endpoint, así los 401 pasan por GlobalExceptionMapper
quarkus.http.auth.proactive=false
# Todo endpoint sin @PermitAll, @Authenticated o @RolesAllowed queda cerrado
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# ===== CSRF (quarkus-rest-csrf, double submit cookie) =====
# GET /api/auth/csrf entrega la cookie csrf-token; POST, PUT y DELETE deben repetir su valor en la
# cabecera X-CSRF-TOKEN. La cookie no es HttpOnly porque el frontend tiene que leerla para enviarla.
# require-form-url-encoded queda en true (valor por defecto): un JSON sin la cabecera se rechaza con 400
quarkus.rest-csrf.create-token-path=/api/auth/csrf
quarkus.rest-csrf.token-header-name=X-CSRF-TOKEN
quarkus.rest-csrf.cookie-http-only=false
%prod.quarkus.rest-csrf.cookie-force-secure=true
